<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blackjack</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="game-table">


    <div class="dealer">
        <h2>Dealer</h2>
        <div id="dealer-cards"></div>
        <span id="dealer-value"></span>
    </div>

    <div class="player">
        <h2>Player</h2>
        <div id="player-cards"></div>
        <p>Player Value: <span id="player-value"></span></p>
        <p>Player Chips: <span id="player-chips"></span></p>
        <p>Current Bet: <span id="player-bet"></span></p>
    </div>

    

    <p id="game-result"></p>
    <p id="countdown"></p>

    <div class="betting-controls" id="betting-controls">

        <div class="chip-buttons">
            <button id="chip-5">5</button>
            <button id="chip-10">10</button>
            <button id="chip-25">25</button>
            <button id="chip-50">50</button>
            <button id="chip-100">100</button>
            <button id="clear-button">clear</button>
        </div>

        <button id="bet-button">Bet</button>

    </div>


    <div class="game-buttons" id="game-buttons">

        <button id="hit-button">Hit</button>
        <button id="stand-button">Stand</button>
        <button id="double-button">Double</button>
    
    </div>


    <div class="ready-buttons" id="ready-buttons">
        <button id="ready-button">Ready</button>

    </div>

</div>

<script src="../js/deck.js"></script>
<script src="../js/chips.js"></script>
<script src="blackjack.js"></script>

</body>
</html>
