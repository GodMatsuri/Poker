<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Texas</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="game-table">
    <div class="pot">
        <h2 class ="box-text">Pot</h2>
        <span class="bet-box" id="pot-value"></span>
    </div>

    <div class="board">
        <div id="board-cards"></div>
    </div>

<div class="players">

    <div class="player">

        <div class="player-texas-cards" id="player-cards"></div>

        <div class="player-info">

            <div class="avatar"></div>

            <div class="player-details">
                <div class="player-name">Player</div>
                <div class="player-chips">
                    <span id="player-chips"></span>
                </div>
                 <span class="player-chips" id="player-bet"></span>
            </div>



        </div>

    </div>

    <div class="opponent">

        <div class="opponent-texas-cards" id="opponent-cards"></div>

        <div class="opponent-info">

            <div class="avatarOp"></div>

            <div class="opponent-details">
                <div class="opponent-name">Bot</div>
                <div class="opponent-chips">
                    <span id="opponent-chips"></span>
                </div>
                <span class="opponent-chips" id="opponent-bet"></span>
            </div>


        </div>

    </div>

</div>

    <p id="game-result"></p>
    <p id="countdown"></p>



    <div class="ready-buttons" id="ready-buttons">
        <button id="ready-button">Deal</button>
    </div>
    
</div>


<div class="betting-controls" id="betting-controls">

    <div class="raise-controls">

        <div class="raise-presets">
            <button id="min-button">MIN</button>
            <button id="quarter-button">1/4</button>
            <button id="half-button">1/2</button>
            <button id="three-quarter-button">3/4</button>
            <button id="all-in-button">ALL IN</button>
        </div>

        <div class="raise-amount">

            <button id="decrease-button">−</button>

            <span id="raise-value">$20</span>

            <button id="increase-button">+</button>

        </div>

        <button id="bet-confirm-button">BET</button>

    </div>

</div>



<div class="game-buttons" id="game-buttons">
    <button id="raise-button">Raise</button>
    <button id="check-button">Check</button>
    <button id="fold-button">Fold</button>
</div>

<script src="../js/deck.js"></script>
<script src="../js/chips.js"></script>
<script src="texas.js"></script>

</body>
</html>
